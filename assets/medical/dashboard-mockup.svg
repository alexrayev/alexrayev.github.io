<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Illustrative mock-up of a multi-device procedure dashboard</title>
<desc id="d">A generic dashboard with a scope panel (pressure, timer, light), a fluid panel (mode, pressure, heat), a video area and a laser panel with two modes. All values are made up and the video area is a placeholder.</desc>
<defs>
<g id="pulse" fill="none" stroke-width="5" stroke-linejoin="round"><path d="M0 40V0H34V30H70" /></g>
</defs>
<rect x="1" y="1" width="998" height="670" rx="12" fill="#1b2235" stroke="#394468" stroke-width="2"/>
<rect x="1" y="1" width="998" height="40" rx="12" fill="#2a3350"/><rect x="1" y="26" width="998" height="15" fill="#2a3350"/>
<text x="500" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="#e8ecf5">Procedure dashboard (illustrative mock-up)</text>

<!-- status row -->
<g font-size="15" fill="#c9d0e4" text-anchor="middle">
<text x="165" y="74" font-size="20">Scope</text><circle cx="232" cy="68" r="5" fill="#3fa05a"/><text x="285" y="73" font-size="12" font-weight="700" fill="#3fa05a">CONNECTED</text>
<text x="450" y="74" font-size="20">Fluid</text><circle cx="505" cy="68" r="5" fill="#3fa05a"/><text x="556" y="73" font-size="12" font-weight="700" fill="#3fa05a">CONNECTED</text>
<text x="745" y="74" font-size="20">Laser</text><circle cx="800" cy="68" r="5" fill="#3fa05a"/><text x="851" y="73" font-size="12" font-weight="700" fill="#3fa05a">CONNECTED</text>
</g>

<!-- scope panel -->
<rect x="24" y="96" width="270" height="236" rx="8" fill="#2a3350"/>
<text x="42" y="132" font-size="26" fill="#f2f5fb">Scope</text>
<g fill="#aeb7d1" font-size="12" font-weight="700" letter-spacing="1"><text x="42" y="168">PRESSURE</text><text x="174" y="168">TIMER</text><text x="42" y="268">BRIGHTNESS</text></g>
<g fill="#fff" font-weight="700"><text x="42" y="200" font-size="30">44</text><text x="174" y="200" font-size="30">05:40</text></g>
<g fill="#aeb7d1" font-size="11"><text x="42" y="216">mmHg</text></g>
<g stroke="#8a93b0" stroke-width="2.5" stroke-linecap="round"><line x1="80" y1="296" x2="104" y2="296" stroke="#5ed0ee"/><line x1="116" y1="296" x2="140" y2="296"/><line x1="152" y1="296" x2="176" y2="296"/><line x1="188" y1="296" x2="212" y2="296"/></g>
<circle cx="58" cy="296" r="9" fill="none" stroke="#c9d0e4" stroke-width="2"/><circle cx="244" cy="296" r="9" fill="#c9d0e4"/>

<!-- fluid panel -->
<rect x="24" y="346" width="270" height="290" rx="8" fill="#2a3350"/>
<text x="42" y="388" font-size="26" fill="#f2f5fb">Fluid</text>
<g font-size="12" font-weight="700" text-anchor="middle">
<rect x="130" y="368" width="48" height="30" fill="none" stroke="#8a93b0"/><text x="154" y="388" fill="#c9d0e4">OFF</text>
<rect x="178" y="368" width="48" height="30" fill="#fff"/><text x="202" y="388" fill="#1b2235">LOW</text>
<rect x="226" y="368" width="48" height="30" fill="none" stroke="#8a93b0"/><text x="250" y="388" fill="#c9d0e4">HIGH</text></g>
<text x="159" y="440" text-anchor="middle" font-size="19" fill="#aeb7d1">Pressure</text>
<g fill="#aeb7d1" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle"><text x="95" y="470">CURRENT</text><text x="225" y="470">SETPOINT</text></g>
<g fill="#fff" font-size="30" font-weight="700" text-anchor="middle"><text x="95" y="504">38</text><text x="225" y="504">40</text></g>
<g fill="#aeb7d1" font-size="11" text-anchor="middle"><text x="95" y="520">mmHg</text><text x="225" y="520">mmHg</text></g>
<line x1="42" y1="540" x2="276" y2="540" stroke="#46506f"/>
<text x="159" y="566" text-anchor="middle" font-size="19" fill="#aeb7d1">Heat</text>
<text x="70" y="598" fill="#fff" font-size="26" font-weight="700">37</text><text x="108" y="598" fill="#aeb7d1" font-size="11">degrees</text>
<g font-size="12" font-weight="700" text-anchor="middle"><rect x="190" y="580" width="40" height="28" fill="#fff"/><text x="210" y="599" fill="#1b2235">OFF</text><rect x="230" y="580" width="40" height="28" fill="none" stroke="#8a93b0"/><text x="250" y="599" fill="#c9d0e4">ON</text></g>

<!-- video placeholder -->
<rect x="312" y="96" width="388" height="388" rx="6" fill="#262e45"/>
<g stroke="#46506f" stroke-width="2" fill="none"><circle cx="506" cy="290" r="110"/><circle cx="506" cy="290" r="64"/><line x1="312" y1="290" x2="700" y2="290" stroke-dasharray="6 8"/><line x1="506" y1="96" x2="506" y2="484" stroke-dasharray="6 8"/></g>
<rect x="376" y="270" width="260" height="34" rx="6" fill="#262e45"/><text x="506" y="294" text-anchor="middle" font-size="18" fill="#8a93b0">Live video area (placeholder)</text>
<rect x="470" y="508" width="52" height="42" rx="5" fill="#d6dbe8"/><rect x="487" y="519" width="7" height="20" fill="#1b2235"/><rect x="499" y="519" width="7" height="20" fill="#1b2235"/>
<text x="570" y="538" font-size="26" fill="#fff" font-weight="600">02:15</text>

<!-- laser panel -->
<rect x="718" y="96" width="258" height="540" rx="8" fill="#2a3350"/>
<text x="738" y="134" font-size="26" fill="#f2f5fb">Laser</text><circle cx="884" cy="126" r="5" fill="#8a93b0"/><text x="895" y="131" font-size="12" font-weight="700" fill="#aeb7d1">STANDBY</text>
<text x="847" y="168" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#aeb7d1">LASING TIME</text>
<text x="847" y="198" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">00:00</text>
<line x1="718" y1="214" x2="976" y2="214" stroke="#394468"/>

<text x="847" y="246" text-anchor="middle" font-size="21" fill="#aeb7d1">Mode A</text>
<g transform="translate(790 300)"><circle r="34" fill="none" stroke="#3d4663" stroke-width="7"/><circle r="34" fill="none" stroke="#f5a623" stroke-width="7" stroke-dasharray="140 214" transform="rotate(-90)"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">40</text><text y="20" text-anchor="middle" font-size="9" fill="#aeb7d1">Hz</text></g>
<g transform="translate(905 300)"><circle r="34" fill="none" stroke="#3d4663" stroke-width="7"/><circle r="34" fill="none" stroke="#f5a623" stroke-width="7" stroke-dasharray="107 214" transform="rotate(-90)"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">0.8</text><text y="20" text-anchor="middle" font-size="9" fill="#aeb7d1">J</text></g>
<text x="738" y="366" font-size="11" font-weight="700" letter-spacing="1" fill="#aeb7d1">PULSE WIDTH</text>
<g transform="translate(738 376) scale(.9)" stroke="#5d6a8e"><use href="#pulse"/></g>
<g transform="translate(804 376) scale(.9)" stroke="#fff"><use href="#pulse"/></g>
<g transform="translate(870 376) scale(.9)" stroke="#5d6a8e"><use href="#pulse"/></g>
<line x1="738" y1="430" x2="956" y2="430" stroke="#394468"/>

<text x="847" y="462" text-anchor="middle" font-size="21" fill="#aeb7d1">Mode B</text>
<g transform="translate(790 516)"><circle r="34" fill="none" stroke="#3d4663" stroke-width="7"/><circle r="34" fill="none" stroke="#f5a623" stroke-width="7" stroke-dasharray="170 214" transform="rotate(-90)"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">50</text><text y="20" text-anchor="middle" font-size="9" fill="#aeb7d1">Hz</text></g>
<g transform="translate(905 516)"><circle r="34" fill="none" stroke="#3d4663" stroke-width="7"/><circle r="34" fill="none" stroke="#f5a623" stroke-width="7" stroke-dasharray="85 214" transform="rotate(-90)"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">0.5</text><text y="20" text-anchor="middle" font-size="9" fill="#aeb7d1">J</text></g>
<text x="738" y="580" font-size="11" font-weight="700" letter-spacing="1" fill="#aeb7d1">PULSE WIDTH</text>
<g transform="translate(738 584) scale(.7)" stroke="#fff"><use href="#pulse"/></g>
<g transform="translate(804 584) scale(.7)" stroke="#5d6a8e"><use href="#pulse"/></g>
<g transform="translate(870 584) scale(.7)" stroke="#5d6a8e"><use href="#pulse"/></g>

<text x="500" y="654" text-anchor="middle" font-size="12" fill="#8a93b0">Illustrative mock-up: all values are made up; no product, logo or patient image is shown.</text>
</svg>
