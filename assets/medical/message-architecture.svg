<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Message-based architecture of a multi-device procedure system</title>
<desc id="d">User-interface processes and device services all connect through one message network with a last-value cache. Devices publish state, interfaces subscribe to it, and commands travel as request and reply.</desc>
<defs>
<marker id="sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f6f8a"/></marker>
<marker id="pub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9641b"/></marker>
<marker id="rr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b2c2c"/></marker>
<radialGradient id="net" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#2c7a6f"/><stop offset="1" stop-color="#173f3a"/></radialGradient>
</defs>
<rect x="1" y="1" width="898" height="558" rx="14" fill="#f7f7f7" stroke="#d9d9d9"/>

<text x="450" y="50" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#575352">USER-INTERFACE PROCESSES</text>
<g fill="#0a8276" stroke="#08665c" stroke-width="2" font-size="17" font-weight="600" text-anchor="middle">
<rect x="50" y="70" width="170" height="56" rx="8"/><rect x="260" y="70" width="170" height="56" rx="8"/><rect x="470" y="70" width="170" height="56" rx="8"/><rect x="680" y="70" width="170" height="56" rx="8"/>
</g>
<g fill="#fff" font-size="17" font-weight="600" text-anchor="middle">
<text x="135" y="104">Dashboard</text><text x="345" y="104">Scope panel</text><text x="555" y="104">Fluid panel</text><text x="765" y="104">Laser panel</text>
</g>

<!-- network -->
<circle cx="450" cy="300" r="120" fill="url(#net)" stroke="#0f332f" stroke-width="3"/>
<text x="450" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Message</text>
<text x="450" y="288" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">network</text>
<circle cx="450" cy="346" r="40" fill="#5aa597" stroke="#e8f4f1" stroke-width="2"/>
<text x="450" y="341" text-anchor="middle" font-size="13" font-weight="600" fill="#0d2b27">Last-value</text>
<text x="450" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#0d2b27">cache</text>

<!-- dashboard: receives updates -->
<line x1="345" y1="242" x2="150" y2="130" stroke="#3f6f8a" stroke-width="2.2" marker-end="url(#sub)"/>
<!-- panels: request/reply -->
<line x1="388" y1="197" x2="352" y2="130" stroke="#9b2c2c" stroke-width="2.2" marker-start="url(#rr)" marker-end="url(#rr)"/>
<line x1="512" y1="197" x2="548" y2="130" stroke="#9b2c2c" stroke-width="2.2" marker-start="url(#rr)" marker-end="url(#rr)"/>
<line x1="555" y1="242" x2="752" y2="130" stroke="#9b2c2c" stroke-width="2.2" marker-start="url(#rr)" marker-end="url(#rr)"/>
<!-- panels also subscribe -->
<line x1="372" y1="204" x2="336" y2="132" stroke="#3f6f8a" stroke-width="2.2" marker-end="url(#sub)"/>
<line x1="528" y1="204" x2="564" y2="132" stroke="#3f6f8a" stroke-width="2.2" marker-end="url(#sub)"/>
<line x1="570" y1="250" x2="770" y2="132" stroke="#3f6f8a" stroke-width="2.2" marker-end="url(#sub)"/>

<!-- services: publish + request/reply -->
<line x1="211" y1="470" x2="338" y2="372" stroke="#d9641b" stroke-width="2.2" marker-end="url(#pub)"/>
<line x1="239" y1="470" x2="366" y2="384" stroke="#9b2c2c" stroke-width="2.2" marker-start="url(#rr)" marker-end="url(#rr)"/>
<line x1="436" y1="470" x2="436" y2="421" stroke="#d9641b" stroke-width="2.2" marker-end="url(#pub)"/>
<line x1="464" y1="470" x2="464" y2="421" stroke="#9b2c2c" stroke-width="2.2" marker-start="url(#rr)" marker-end="url(#rr)"/>
<line x1="661" y1="470" x2="534" y2="372" stroke="#d9641b" stroke-width="2.2" marker-end="url(#pub)"/>
<line x1="689" y1="470" x2="562" y2="384" stroke="#9b2c2c" stroke-width="2.2" marker-start="url(#rr)" marker-end="url(#rr)"/>

<text x="450" y="549" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#575352">DEVICE SERVICES (one per device)</text>
<g fill="#f97414" stroke="#b9500a" stroke-width="2"><rect x="140" y="470" width="170" height="56" rx="8"/><rect x="365" y="470" width="170" height="56" rx="8"/><rect x="590" y="470" width="170" height="56" rx="8"/></g>
<g fill="#fff" font-size="17" font-weight="600" text-anchor="middle"><text x="225" y="504">Scope service</text><text x="450" y="504">Fluid service</text><text x="675" y="504">Laser service</text></g>

<!-- legend -->
<g font-size="13" fill="#333">
<line x1="24" y1="226" x2="70" y2="226" stroke="#d9641b" stroke-width="2.2" marker-end="url(#pub)"/><text x="80" y="231">Publish: device state</text>
<line x1="24" y1="256" x2="70" y2="256" stroke="#3f6f8a" stroke-width="2.2" marker-end="url(#sub)"/><text x="80" y="261">Subscribe: receive updates</text>
<line x1="24" y1="286" x2="70" y2="286" stroke="#9b2c2c" stroke-width="2.2" marker-start="url(#rr)" marker-end="url(#rr)"/><text x="80" y="291">Request / reply: commands</text>
</g>
</svg>
